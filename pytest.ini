[pytest]
# pytest configuration for FastAPI TodoApp

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Markers for organizing tests
markers =
    unit: Unit tests (testing individual functions/classes)
    integration: Integration tests (testing multiple components together)
    auth: Authentication-related tests
    todos: Todo CRUD operation tests
    users: User management tests
    admin: Admin operation tests

# Coverage options
addopts =
    --verbose
    --strict-markers
    -ra

# Timeout for tests (optional, requires pytest-timeout)
# timeout = 10
