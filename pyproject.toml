[project]
name = "fastapi-the-complete-course-2026"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "bcrypt==4.0.1",
    "click==8.4.0",
    "fastapi>=0.136.1",
    "idna==3.15",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic==2.13.4",
    "pydantic-core>=2.46.3",
    "python-dotenv>=1.0.0",
    "python-jose>=3.5.0",
    "python-multipart==0.0.32",
    "sqlalchemy>=2.0.49",
    "starlette>=1.0.0",
    "uliweb-alembic>=0.6.9",
    "uvicorn==0.47.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]
